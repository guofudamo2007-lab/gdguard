name: GDGuard
description: Run local static Godot resource checks
author: guofudamo2007-lab
inputs:
  path:
    description: Path to the Godot project (static checks only)
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Install this GDGuard checkout
      shell: bash
      env:
        GDGUARD_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --force-reinstall --no-deps "$GDGUARD_ACTION_PATH"
    - name: Check Godot project
      shell: bash
      env:
        GDGUARD_PROJECT_PATH: ${{ inputs.path }}
      run: python -I -m gdguard check -- "$GDGUARD_PROJECT_PATH"
branding:
  icon: shield
  color: purple
