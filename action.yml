name: GDGuard
description: Run GDGuard Godot project checks
author: guofudamo2007-lab
inputs:
  path:
    description: Path to the Godot project
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Install GDGuard
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Check Godot project
      shell: bash
      run: gdguard check "${{ inputs.path }}"
branding:
  icon: shield
  color: purple
