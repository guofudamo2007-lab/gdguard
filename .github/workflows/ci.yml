name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GDGuard
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest

      - name: CLI smoke
        run: |
          gdguard --help
          gdguard --version
          gdguard check tests/fixtures/valid_project
          gdguard check tests/fixtures/valid_project --format json

      - name: Broken fixture should fail
        run: |
          set +e
          gdguard check tests/fixtures/missing_resource
          status=$?
          set -e
          test "$status" -eq 1
