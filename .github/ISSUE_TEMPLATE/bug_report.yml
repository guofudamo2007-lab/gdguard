name: Bug report
description: Report incorrect GDGuard behavior
labels: ["bug"]
body:
  - type: input
    id: gdguard_version
    attributes:
      label: GDGuard version
      placeholder: "0.2.0rc1"
    validations:
      required: true
  - type: input
    id: godot_version
    attributes:
      label: Godot version
      placeholder: "4.3, unknown, or not installed"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11, Ubuntu 24.04, macOS 15"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: "gdguard check ."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized text/JSON output
      description: Remove API keys, secrets, private paths and private game content.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A tiny self-authored or licensed reproduction. Do not attach private game assets or secrets.
    validations:
      required: true
