[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdguard"
version = "0.2.0rc1"
description = "Local static resource checks and opt-in runtime checks for Godot projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "二等分的悟" },
]
keywords = ["godot", "gdscript", "ci", "validation", "quality-gate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
gdguard = "gdguard.cli:main"

[project.urls]
Repository = "https://github.com/guofudamo2007-lab/gdguard"
Issues = "https://github.com/guofudamo2007-lab/gdguard/issues"
Changelog = "https://github.com/guofudamo2007-lab/gdguard/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["godot: opt-in real Godot integration on trusted fixtures"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
